name: Download Instagram Reel

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Instagram Reel URL'
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yt-dlp

      - name: Check rate limit
        run: python check_reel_limit.py

      - name: Create downloads directory
        run: mkdir -p downloads

      - name: Download reel
        run: |
          yt-dlp \
            -o "downloads/%(title)s.%(ext)s" \
            "${{ inputs.url }}"

      - name: Save rate limit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rate_limiter.json
          git diff --staged --quiet || git commit -m "Update rate limit [skip ci]"
          git push || true

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reel-download
          path: downloads/
          retention-days: 7
