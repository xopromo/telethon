name: Process Download Queue

on:
  push:
    paths:
      - 'download_queue.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yt-dlp

      - name: Setup Instagram cookies
        run: |
          if [ -n "${{ secrets.INSTAGRAM_COOKIES }}" ]; then
            echo "${{ secrets.INSTAGRAM_COOKIES }}" > instagram_cookies.txt
            echo "✅ Cookies loaded"
          fi

      - name: Process queue
        run: python process_queue.py

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reel-downloads
          path: downloads/
          retention-days: 7

      - name: Update queue and rate limiter
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add download_queue.json rate_limiter.json
          git diff --staged --quiet || git commit -m "Update queue after processing [skip ci]"
          git push || true
