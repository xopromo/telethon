name: Telegram Insights Agent

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel username (e.g. VelesCommunityRu)'
        required: true
        default: 'VelesCommunityRu'
      topic:
        description: 'Topic name (e.g. Pro трейдинг)'
        required: false
        default: 'Pro трейдинг'
      batch:
        description: 'Posts per run (default 1000)'
        required: false
        default: '1000'

permissions:
  contents: write

jobs:
  run-insights:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install telethon==1.43.2 python-dotenv requests google-generativeai

      - name: Restore Telegram session
        env:
          SESSION_BASE64: ${{ secrets.SESSION_BASE64 }}
        run: |
          if [ -n "$SESSION_BASE64" ]; then
            echo "$SESSION_BASE64" | base64 -d > telegram_session.session
            echo "Session restored ✅"
          else
            echo "No session found"
            exit 1
          fi

      - name: Create .env file
        run: |
          cat > .env << EOF
          TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_PHONE=${{ secrets.TELEGRAM_PHONE }}
          MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY=${{ secrets.CEREBRAS_API_KEY }}
          SESSION_NAME=telegram_session
          EOF

      - name: Run Insights Agent
        run: |
          python insights_agent.py \
            --channel "${{ github.event.inputs.channel }}" \
            --topic "${{ github.event.inputs.topic }}" \
            --batch "${{ github.event.inputs.batch }}"

      - name: Save state back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git merge origin/claude/telethon-telegram-ai-agent-BEWcw || true
          git add insights_state.json
          git diff --staged --quiet || git commit -m "Update insights state [skip ci]"
          git push
