name: Telegram Content Agent

on:
  workflow_dispatch:  # Manual trigger only (button in GitHub Actions tab)

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with remote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --no-rebase origin claude/telethon-telegram-ai-agent-BEWcw || true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install telethon==1.43.2 python-dotenv requests google-generativeai

      - name: Restore Telegram session
        env:
          SESSION_BASE64: ${{ secrets.SESSION_BASE64 }}
        run: |
          if [ -n "$SESSION_BASE64" ]; then
            echo "$SESSION_BASE64" | base64 -d > telegram_session.session
            echo "Session restored ✅"
          else
            echo "No session found - first run requires local auth"
          fi

      - name: Create .env file
        run: |
          cat > .env << EOF
          TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_PHONE=${{ secrets.TELEGRAM_PHONE }}
          MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY=${{ secrets.CEREBRAS_API_KEY }}
          SESSION_NAME=telegram_session
          EOF

      - name: Run Content Agent
        run: python content_agent.py

      - name: Save processed IDs back to repo
        if: always()
        run: |
          git add processed_ids.json all_seen_posts.json
          git diff --staged --quiet || git commit -m "Update post tracking [skip ci]" && git push || true

      - name: Save updated session
        if: always()
        run: |
          if [ -f telegram_session.session ]; then
            SESSION=$(base64 -w 0 telegram_session.session)
            echo "SESSION_BASE64=$SESSION" >> $GITHUB_OUTPUT
            echo "Session saved ✅"
          fi
